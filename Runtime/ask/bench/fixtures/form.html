<!doctype html>
<meta charset="utf-8">
<title>Order Form</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 2rem; max-width: 26rem; }
  label { display: block; margin: .8rem 0 .25rem; }
  input[type=text], input[type=email], select { width: 100%; padding: .4rem; }
  .row { margin-top: .8rem; }
  #result { margin-top: 1.2rem; padding: .8rem; background: #e8f5e9; border: 1px solid #a5d6a7; display: none; white-space: pre-wrap; }
  #result.show { display: block; }
</style>
<h1>Office supplies order</h1>
<form id="order">
  <label for="name">Full name</label>
  <input id="name" name="name" type="text" autocomplete="off">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="off">
  <label for="country">Country</label>
  <select id="country" name="country">
    <option value="">— choose —</option>
    <option value="France">France</option>
    <option value="Germany">Germany</option>
    <option value="Japan">Japan</option>
    <option value="USA">USA</option>
  </select>
  <div class="row">
    <label><input id="agree" name="agree" type="checkbox"> I agree to the terms</label>
  </div>
  <div class="row"><button id="send" type="submit">Place order</button></div>
</form>
<div id="result" role="status"></div>
<script>
  document.getElementById('order').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value;
    var email = document.getElementById('email').value;
    var country = document.getElementById('country').value;
    var agree = document.getElementById('agree').checked ? 'yes' : 'no';
    var out = document.getElementById('result');
    out.textContent = 'CONF-741\nname: ' + name + '\nemail: ' + email +
      '\ncountry: ' + country + '\nagreed: ' + agree;
    out.classList.add('show');
  });
</script>
