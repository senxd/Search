<!doctype html>
<meta charset="utf-8">
<title>Buy It</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; }
  main { padding: 2rem; }
  #buy { font-size: 1.2rem; padding: .6rem 1.6rem; }
  #bought { margin-top: 1rem; padding: .8rem; background: #e3f2fd; display: none; }
  #bought.show { display: block; }
  #veil {
    position: fixed; inset: 0; background: rgba(20, 20, 30, .55);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #veil .card {
    background: #fff; padding: 1.6rem 2rem; border-radius: .5rem;
    text-align: center; max-width: 20rem;
  }
</style>
<main>
  <h1>Today only</h1>
  <p>A very fine thing, priced to move.</p>
  <button id="buy" type="button">Buy</button>
  <div id="bought">Purchased — thank you.</div>
</main>
<div id="veil">
  <div class="card">
    <p><b>One moment</b></p>
    <p>This panel is in the way of everything beneath it.</p>
    <button id="dismiss" type="button">Dismiss</button>
  </div>
</div>
<script>
  document.getElementById('dismiss').addEventListener('click', function () {
    document.getElementById('veil').remove();
  });
  document.getElementById('buy').addEventListener('click', function () {
    document.getElementById('bought').classList.add('show');
  });
</script>
