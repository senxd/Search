<!doctype html>
<meta charset="utf-8">
<title>Checkout</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 2rem; }
  #order { font-size: 1.1rem; padding: .5rem 1.4rem; }
  #note { margin-top: 1rem; color: #b71c1c; }
</style>
<h1>Checkout</h1>
<p>Your basket is ready.</p>
<button id="order" type="button">Place order</button>
<div id="note"></div>
<script>
  // The first click always fails with "try again"; the click after that
  // goes through to the confirmation page. No state lives in the DOM
  // beyond the note.
  var failed = false;
  document.getElementById('order').addEventListener('click', function () {
    if (!failed) {
      failed = true;
      document.getElementById('note').textContent = 'Something went wrong — try again.';
      return;
    }
    location.href = 'ordered.html';
  });
</script>
