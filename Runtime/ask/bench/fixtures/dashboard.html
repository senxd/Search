<!doctype html>
<meta charset="utf-8">
<title>Mission Control</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 2rem; background: #101522; color: #dde4f0; }
  .panel { display: flex; gap: 1rem; margin-top: 1.5rem; }
  button { font-size: 1rem; padding: .7rem 1.4rem; border: 0; border-radius: .4rem; }
  #deploy { background: #2e7d32; color: #fff; }
  #abort { background: #c62828; color: #fff; }
  #ping { background: #1565c0; color: #fff; }
  #reset { background: #6a1b9a; color: #fff; }
</style>
<h1>Mission Control</h1>
<p>Four big switches, each with its own job.</p>
<div class="panel">
  <button id="deploy" type="button">Deploy</button>
  <button id="abort" type="button">Abort</button>
  <button id="ping" type="button">Ping</button>
  <button id="reset" type="button">Reset</button>
</div>
